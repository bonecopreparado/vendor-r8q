name: Legacy R8Q audit (superseded)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  superseded:
    runs-on: ubuntu-24.04
    steps:
      - name: Explain the replacement
        run: |
          echo 'This historical branch-specific audit workflow is superseded by R8Q CI on main and pull requests.'
          echo 'No installer or GoFile upload is produced by this workflow.' >> "$GITHUB_STEP_SUMMARY"
