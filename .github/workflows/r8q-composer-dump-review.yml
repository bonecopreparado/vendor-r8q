name: Compile ARM64 read-only composer dump probe - NOT AN INSTALLER
on:
  push:
    branches: [r8q-composer-dump-review-20261111]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile-probe-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install build host prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends git python3 unzip
          df -h "$GITHUB_WORKSPACE"
      - name: Check native probe ELF review guards
        run: python3 -m unittest discover -s ci-r8q/tests -p test_composer_dump_build.py -v
      - name: Compile pinned VNDK30 ABI client and inspect dependencies
        run: python3 tools/display_probe/build_probe.py
      - name: Compare dependency names with original vendor inventory - informational
        run: python3 tools/display_probe/inventory_inputs.py --build-report reports/composer-dump-build/summary.json --output reports/composer-dump-build/vendor-library-inventory.json
      - name: Retain offline binary and compile evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: R8Q-COMPOSER-DUMP-OFFLINE-REVIEW-NOT-AN-INSTALLER
          path: reports/composer-dump-build/
          retention-days: 14
