name: Package reviewed R8Q tools and audit
on:
  push:
    branches: [r8q-delivery-20261101]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  delivery:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      R8Q_PROJECT_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Reuse the already tested CI evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p downloads
          gh api repos/bonecopreparado/vendor-r8q/actions/artifacts/13060837389/zip > downloads/tools-evidence.zip
          gh api repos/bonecopreparado/vendor-r8q/actions/artifacts/13063619416/zip > downloads/vendor-evidence.zip
          python3 ci-r8q/tools/import_ci_evidence.py
      - name: Generate the same reviewed Windows and read-only kits
        run: |
          python3 tools/prepare_p0r7_installer.py
          python3 tools/package_p0r7_kit.py
          python3 tools/package_readonly_r8q_probe.py
          python3 ci-r8q/tools/make_delivery_bundle.py
      - name: Save reviewed bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: r8q-reviewed-delivery-${{ github.run_number }}
          path: |
            output/Auditoria-R8Q-20261031.zip
            output/Auditoria-R8Q-20261031.zip.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Mirror reviewed tools and reports to GoFile
        env:
          GOFILE_TOKEN: ${{ secrets.GOFILE_TOKEN }}
        run: python3 ci-r8q/tools/gofile_upload.py output/Auditoria-R8Q-20261031.zip --summary "$GITHUB_STEP_SUMMARY" --result output/gofile.json
