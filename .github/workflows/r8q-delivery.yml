name: Package current R8Q audit reports (not flashable)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reports:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Package current checkout reports and status
        run: python3 ci-r8q/tools/make_delivery_bundle.py
      - name: Save reports only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: R8Q-AUDIT-REPORTS-NOT-FLASHABLE-${{ github.run_number }}
          path: |
            output/R8Q-AUDIT-REPORTS-NOT-FLASHABLE.tar.gz
            output/R8Q-AUDIT-REPORTS-NOT-FLASHABLE.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
