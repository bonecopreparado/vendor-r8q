name: P1 source and filesystem regression checks
on:
  push:
    branches: [r8q-p1-20261102]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      MKSH_BINARY: /bin/mksh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare bounded filesystem fixture tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends e2fsprogs mksh python3-brotli libdeflate0 liblz4-1 liblzma5 libselinux1 libuuid1 libxxhash0 libzstd1
          curl -fsSL --max-time 120 https://deb.debian.org/debian/pool/main/e/erofs-utils/erofs-utils_1.8.6-1_amd64.deb -o /tmp/erofs-utils.deb
          printf '%s  %s\n' 81042b8c0c3eb63699aa7d0763dceedc675a747d9f5cfebf914b4160233f411e /tmp/erofs-utils.deb | sha256sum -c -
          dpkg-deb -x /tmp/erofs-utils.deb tools/image-tools/root
          mkdir -p tools/image-tools/bin ci-results/p1
          for tool in dump.erofs fsck.erofs; do ln -s ../root/usr/bin/$tool tools/image-tools/bin/$tool; done
      - name: Test clean-source transformations and actual bounded ext4 fixtures
        run: |
          set -o pipefail
          /usr/bin/python3 -m unittest discover -s ci-r8q/tests -v 2>&1 | tee ci-results/p1/unit-tests.txt
          /usr/bin/python3 tools/materialize_policy_bundle.py
          /usr/bin/python3 patches/0005-vintf-adaptation/test_candidates.py 2>&1 | tee ci-results/p1/vintf-source-tests.txt
      - name: Test complete EROFS rebuild metadata and content preservation
        run: |
          set -o pipefail
          /usr/bin/python3 ci-r8q/regression/rebuild_erofs_fixture.py 2>&1 | tee ci-results/p1/erofs-tests.txt
      - name: Build battery-protected installer candidate and test inherited guards
        run: |
          python3 tools/package_ready_p0r8.py
          MKSH_BINARY=/bin/mksh python3 ci-r8q/regression/battery_installer_tests.py > ci-results/p1/installer-tests.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: P1-SOURCE-VALIDATION-NOT-A-ROM
          path: ci-results/p1
          if-no-files-found: error
          retention-days: 30
