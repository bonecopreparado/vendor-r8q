name: Legacy P0r7 READY delivery (superseded)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  superseded:
    runs-on: ubuntu-24.04
    steps:
      - name: Explain the replacement
        run: |
          echo 'Historical P0r7 distribution is superseded. No device test is recommended for the unresolved P0 composition.'
          echo 'Use the reviewed main-only candidate release workflow. Candidates remain draft prereleases; no GoFile upload is made.' >> "$GITHUB_STEP_SUMMARY"
