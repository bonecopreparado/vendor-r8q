name: Probe public P1 source availability
on:
  push:
    branches: [r8q-p1-source-probe20261102]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Read source metadata and bounded ZIP prefixes
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error,urllib.parse
          report={}
          sources={
              'hyperos':('https://pixeldrain.com/api/file/Ygwm7Nx3',5376154497,'c5eff65d1f963c44c4c44e627cfb789ec7168706685be64030135a44e63fe11d'),
              'vendor':('https://github.com/bonecopreparado/vendor-r8q/releases/download/0.0.1/Color.os.build.zip',931453816,'d8db5aa65498718a00d55f01e8f7965a4a7918864452be69b483cc48d68674db')}
          try:
              with urllib.request.urlopen('https://pixeldrain.com/api/file/Ygwm7Nx3/info',timeout=25) as r:
                  data=r.read(1024*1024+1)
                  if len(data)>1024*1024:raise ValueError('Info exceeds bound')
                  info=json.loads(data)
              sha=info.get('hash_sha256') or info.get('sha256')
              report['hyperos_info']={k:info[k] for k in ('id','name','size','mime_type','availability','success') if k in info}
              report['hyperos_info'].update(size_matches=info.get('size')==sources['hyperos'][1],sha256_present=bool(sha),sha256_matches=sha==sources['hyperos'][2] if sha else None)
          except Exception as e:
              report['hyperos_info']=dict(error=type(e).__name__,http_status=getattr(e,'code',None))
          for name,(url,size,sha) in sources.items():
              try:
                  req=urllib.request.Request(url,headers={'Range':'bytes=0-65535','User-Agent':'R8Q-source-probe/1.0'})
                  with urllib.request.urlopen(req,timeout=30) as response:
                      data=response.read(65536)
                      row=dict(status=response.status,bytes_read=len(data),zip_prefix=data[:4]==b'PK\x03\x04',
                               content_length=response.headers.get('Content-Length'),content_range=response.headers.get('Content-Range'),
                               final_host=urllib.parse.urlsplit(response.url).hostname)
                  row['expected_full_bytes']=size
                  row['accessible_zip_prefix']=row['zip_prefix'] and len(data)==65536
                  report[name]=row
              except Exception as e:
                  report[name]=dict(error=type(e).__name__,http_status=getattr(e,'code',None),accessible_zip_prefix=False)
          try:
              with urllib.request.urlopen('https://gofile.io/api',timeout=20) as r:
                  text=r.read(2*1024*1024).decode(errors='replace')
              report['gofile_docs']=dict(http_accessible=True,page_bytes=len(text),explicit_five_gb_limit=('5 GB' in text or '5GB' in text),explicit_unlimited=('unlimited file size' in text.lower()))
          except Exception as e:report['gofile_docs']=dict(error=type(e).__name__,http_status=getattr(e,'code',None))
          print(json.dumps(report,indent=2))
          print('This bounded probe does not replace the full download size and SHA256 check.')
          if not all(report[k].get('accessible_zip_prefix') for k in sources):raise SystemExit(1)
          PY
