name: Review SurfaceFlinger group32 correction (no ROM)
on:
  push:
    branches: [r8q-display-group32-20261114]
    paths:
      - tools/display_group/**
      - ci-r8q/tests/test_display_group_patch.py
      - reports/p1/display-group32-review-20261114/**
      - .github/workflows/r8q-display-group32-review.yml
  pull_request:
    paths:
      - tools/display_group/**
      - ci-r8q/tests/test_display_group_patch.py
      - .github/workflows/r8q-display-group32-review.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned offline review dependencies
        run: |
          python3 -m venv .venv-display-review
          .venv-display-review/bin/python -m pip install unicorn==2.1.4 pyelftools==0.32
      - name: Check syntax and ARM64 group/file-guard regressions
        run: |
          .venv-display-review/bin/python -m compileall -q tools/display_group ci-r8q/tests/test_display_group_patch.py
          .venv-display-review/bin/python -m unittest discover -s ci-r8q/tests -p test_display_group_patch.py -v
      - name: State verification limits
        run: |
          echo 'No OEM binaries are downloaded or uploaded. No ROM is rebuilt, released or flashed.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Full received-function emulation was run privately; the committed sanitized report records its scope and hashes.' >> "$GITHUB_STEP_SUMMARY"
